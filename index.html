<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F7">
<title>Focússimo Sprint — 8 недель</title>
<meta name="description" content="Фокуссимо Спринт — система планирования на 8 недель: цель, инструменты, задачи, привычки, трекеры и аналитика.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F7;
  --ink:#2E2E2E;
  --white:#FFFFFF;
  /* Бедже (базовая) */
  --head:#E8DCD0;
  --head-ink:#574F44;
  --row:#FAF6F2;
  --row-hi:#FFFDFB;
  --chipbg:#F2EAE2;
  --accent:#2E6B8A;
  --accent-d:#24566E;
  --accent-soft:rgba(46,107,138,.28);
  --muted:#6E675E;
  --line:#EAE0D1;
  --line-soft:#F1E9DD;
  --sand:#DFD2C0;
  --track:#EFE7DB;
  --dash:#EFE5D8;
  --focus:#E4D7C4;
  --ph:#BDB2A2;
  --chk-line:#D9CBB8;
  --star-off:#D9CDBC;
  --rm:#C9BEAC;
  --add-hi:#F2E7D8;
  --done-ink:#A39A8D;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{background:var(--bg)}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Montserrat',sans-serif;
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;min-height:100dvh;
  overscroll-behavior-y:none;
}
img{display:block}
button{font-family:inherit;cursor:pointer}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes rowflash{0%{background:#F7EAD2}100%{}}

.app{max-width:640px;margin:0 auto;padding:14px 14px 92px}

/* ---------- логотип ---------- */
.hero{display:flex;justify-content:center;align-items:center;animation:rise .5s ease both}
.logo{width:min(62.4vw,216px);height:auto;margin:6px auto 0;display:block}

/* ---------- выбор недели ---------- */
.wk-pills{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding:12px 0 2px;
  -webkit-overflow-scrolling:touch;
  user-select:none;-webkit-user-select:none;
}
.wk-pills::-webkit-scrollbar{display:none}
.wk{
  flex:none;min-width:64px;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  border:1px solid var(--line);background:var(--white);
  border-radius:12px;padding:7px 10px 6px;
  font-family:'Montserrat',sans-serif;
  transition:background .15s,border-color .15s,opacity .15s;
}
.wk b{font-size:11px;font-weight:600;letter-spacing:.08em}
.wk small{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:500;font-family:'Montserrat',sans-serif}
.wk.cur{background:var(--accent);border-color:var(--accent)}
.wk.cur b{color:#fff}
.wk.cur small{color:#D8EAF3}
.wk.lock{opacity:.45;border-style:dashed;cursor:default}
.wk:active{transform:scale(.96)}
.wk + .wk{position:relative}
.wk + .wk::before{content:'';position:absolute;left:-3.5px;top:50%;transform:translateY(-50%);width:1px;height:22px;background:var(--head);border-radius:1px}

/* ---------- панель спринта ---------- */
.weekbar{
  margin-top:12px;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  box-shadow:0 1px 2px rgba(46,46,46,.03),0 10px 24px rgba(46,46,46,.04);
  animation:rise .5s .05s ease both;
  user-select:none;-webkit-user-select:none;
}
.wb-left{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wb-label{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.wb-range{font-family:'Montserrat',sans-serif;font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.wb-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .datepick-hidden{position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;margin:0}
.btn-ghost{
  border:1px solid var(--line);background:var(--white);color:var(--muted);
  border-radius:9px;padding:9px 14px;font-size:11px;font-weight:500;letter-spacing:.08em;
  transition:background .15s,color .15s,border-color .15s;
}
.btn-ghost:hover{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- навигация: спринт + 7 дней ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:var(--white);
  border-top:1px solid var(--line);
  display:flex;overflow-x:auto;scrollbar-width:none;
  padding:0 2px calc(env(safe-area-inset-bottom) + 2px);
  box-shadow:0 -6px 18px rgba(46,46,46,.06);
  user-select:none;-webkit-user-select:none;
}
.nav::-webkit-scrollbar{display:none}
.nav .tab{
  flex:1 0 auto;min-width:44px;position:relative;
  border:none;background:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  padding:11px 3px 9px;color:var(--muted);
  font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  transition:color .15s;
}
.nav .tab.main{color:var(--accent)}
.nav .tab.past{color:var(--accent)}
.nav .tab.active{color:var(--accent)}
.nav .tab.active::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:20px;height:2px;border-radius:0 0 3px 3px;background:var(--accent);
}
.nav .tab.alt{background:var(--accent);color:#fff}
.nav .tab.alt.active::before{background:#fff}
.nav .tab.checked{background:var(--accent);color:#fff}
.nav .tab.checked.active::before{background:#fff}
.nav .tchk{position:absolute;top:5px;right:6px;width:11px;height:11px}
.nav .tchk path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

.nav .tab + .nav .tab{position:relative}
.nav .tab + .nav .tab::after{content:'';position:absolute;left:-0.5px;top:50%;transform:translateY(-50%);width:1px;height:22px;background:var(--head);border-radius:1px}
.nav .tab:active{opacity:.65}

main{margin-top:16px}
.view{max-width:640px;margin:0 auto;animation:rise .3s ease both}
.view[hidden]{display:none}

/* ---------- карточки ---------- */
.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  margin-bottom:14px;
  box-shadow:0 1px 2px rgba(46,46,46,.03),0 10px 24px rgba(46,46,46,.04);
}
  .section-head{
  background:var(--head);
  font-family:'Montserrat',sans-serif;font-weight:600;
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--head-ink);
  padding:11px 14px;
  display:flex;align-items:center;gap:8px;
  user-select:none;-webkit-user-select:none;
}
.sh-ic{display:inline-flex;color:var(--accent);flex:none}
.sh-ic svg{display:block}
.sh-badge{
  margin-left:auto;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  background:var(--white);border-radius:999px;padding:3px 10px;color:var(--accent);
}
.sh-in{
  flex:1;min-width:0;border:none;background:transparent;
  font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;
  padding:2px 4px;margin:-2px -4px;border-radius:6px;
  user-select:text;-webkit-user-select:text;
}
.sh-in:focus{outline:none;background:var(--white);box-shadow:0 0 0 2px var(--focus)}
.sh-in::placeholder{color:var(--ph)}
.kv{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-top:1px solid var(--line-soft);
  font-size:14.5px;
}
.kv:first-of-type{border-top:none}
.kv b{font-family:'Montserrat',sans-serif;font-weight:600}
.kv .accent{color:var(--accent)}
#v-sprint .kv{font-size:11px;font-weight:500;letter-spacing:.08em}
#v-sprint .kv b{font-weight:500}

/* ---------- кольцо прогресса ---------- */
.ring{position:relative;display:inline-block;flex:none}
.ring svg{display:block}
.ring .val{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Montserrat',sans-serif;font-weight:700;color:var(--accent);
}
.week-progress{display:flex;align-items:center;gap:18px;padding:14px;flex-wrap:wrap}
.ring-big .val{font-size:24px;letter-spacing:-.02em}

/* строки «Неделя N» на главной: текст как в «Прогресс спринта» (.kv — 14.5px), полоса на всю ширину */
.hrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line-soft)}
.hrow:first-child{border-top:none}
.hrow-l{flex:none;width:92px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em}
.hrow-bar{flex:1;height:12px;background:var(--track);border-radius:99px;overflow:hidden;display:block}
.hrow-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hrow-v{flex:none;width:52px;text-align:right;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--ink)}

/* ---------- задачи ---------- */
.task{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;min-height:46px;
  border-top:1px solid var(--line-soft);
}
.task:first-child{border-top:none}
.task:nth-child(odd){background:var(--white)}
.task:nth-child(even){background:var(--row)}
.task.flash{animation:rowflash 1.2s ease}
.chk{
  width:28px;height:28px;flex:none;
  border-radius:9px;border:1.5px solid var(--chk-line);background:var(--chipbg);
  display:grid;place-items:center;padding:0;
  transition:background .12s,border-color .12s;
}
.chk svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on svg{opacity:1;animation:pop .18s ease}
.task-in{
  flex:1;min-width:0;border:none;background:transparent;
  font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--ink);
  padding:6px 2px;
}
.task-in:focus{outline:none;background:var(--white);box-shadow:0 0 0 2px var(--focus)}
.task-in::placeholder{color:var(--ph)}
.task.done .task-in{color:var(--done-ink);text-decoration:line-through}
.rmbtn{
  width:28px;height:28px;flex:none;border-radius:50%;
  border:1px solid transparent;background:transparent;
  color:var(--rm);font-size:16px;line-height:1;
  display:grid;place-items:center;transition:color .12s,border-color .12s;
}
.rmbtn:hover{color:var(--accent);border-color:var(--line)}

/* ---------- кнопки добавить ---------- */
.addbtn{
  width:calc(100% - 28px);margin:10px 14px 12px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  border:1.5px dashed var(--chk-line);background:var(--row);color:var(--accent);
  border-radius:11px;padding:11px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  transition:background .15s,border-color .15s;
}
.addbtn:hover{background:var(--add-hi);border-color:var(--accent)}
.addbtn svg{display:block;flex:none}

/* ---------- лента дня ---------- */
.dayhead{
  display:flex;align-items:center;gap:12px;
  background:var(--head);padding:14px;
  user-select:none;-webkit-user-select:none;
}
.dayhead b{font-family:'Montserrat',sans-serif;font-weight:600;font-size:20px;letter-spacing:-.01em;color:var(--accent)}
.dayhead .dh-sub{font-size:11px;font-weight:500;color:var(--head-ink);margin-top:2px;letter-spacing:.08em}
.dayhead .dh-done{font-size:11px;font-weight:500;color:var(--accent);letter-spacing:.08em;margin-top:3px}
.ring-dh{margin-left:auto}
.ring-dh .ring .val{font-size:11px;font-weight:500;letter-spacing:.08em}

.dgrid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){
  .dgrid{grid-template-columns:1.35fr 1fr;align-items:start}
  .dcol-side{display:grid;gap:14px}
}

/* ---------- привычки ---------- */
.hab-day{display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:48px;border-top:1px solid var(--line-soft)}
.hab-day:first-of-type{border-top:none}
.hchk{
  width:32px;height:32px;border-radius:9px;flex:none;
  border:1.5px solid var(--chk-line);background:var(--chipbg);
  display:grid;place-items:center;padding:0;
  transition:background .12s,border-color .12s;
}
.hchk svg{width:17px;height:17px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.hchk.on{background:var(--accent);border-color:var(--accent)}
.hchk.on svg{opacity:1;animation:pop .18s ease}
.hab-name{
  flex:1;min-width:0;border:none;background:transparent;
  font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--ink);
  padding:6px 2px;
}
.hab-name:focus{outline:none;background:var(--white);box-shadow:0 0 0 2px var(--focus)}

/* ---------- вечерние трекеры ---------- */
.tracker-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-top:1px solid var(--line-soft);font-size:14px;gap:10px;flex-wrap:wrap;user-select:none;-webkit-user-select:none}
.tracker-row:first-of-type{border-top:none}
.tracker-row .tl{color:var(--ink);display:flex;align-items:center;gap:8px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em}
.tracker-row .tl svg{color:var(--accent)}
.tracker-row .tl-in{
  border:none;background:transparent;
  font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--ink);
  width:118px;padding:2px 5px;margin:-2px -5px;border-radius:6px;
  user-select:text;-webkit-user-select:text;
}
.tracker-row .tl-in:focus{outline:none;background:var(--row);box-shadow:0 0 0 2px var(--focus)}
.week-progress .ring,.tri-rings .ring{width:min(116px,calc((100vw - 58px)/3))!important;height:min(116px,calc((100vw - 58px)/3))!important}
.week-progress .ring svg,.tri-rings .ring svg{width:100%!important;height:100%!important}
.tri-rings{display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:flex-start;padding:14px}
.tri-rings .ring .val{font-size:15px!important}
@media(min-width:640px){.tri-rings .ring .val{font-size:20px!important}}
.tri-cell{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.tri-lbl{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted);text-align:center;max-width:116px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stars{display:inline-flex;gap:2px}
.stars button{
  border:none;background:none;
  font-size:17px;line-height:1;color:var(--star-off);padding:3px 2px;
  transition:transform .1s,color .1s;
}
.stars button.on{color:var(--accent)}
.stars button:active{transform:scale(1.25)}
.sleep-wrap{display:flex;align-items:center;gap:7px;user-select:none;-webkit-user-select:none}
.sleep-wrap input{
  width:76px;border:1px solid var(--line);border-radius:9px;background:var(--row);
  font-family:'Montserrat',sans-serif;font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--ink);
  padding:8px 8px;text-align:center;
}
.sleep-wrap input:focus{outline:none;box-shadow:0 0 0 2px var(--focus)}
.sleep-wrap i{font-style:normal;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted)}

/* ---------- дневник ---------- */
.jf-grid{display:grid;grid-template-columns:1fr;gap:0}
.jf{padding:12px 14px;border-top:1px solid var(--line-soft)}
.jf:first-of-type{border-top:none}
@media(min-width:640px){
  .jf-grid{grid-template-columns:1fr 1fr}
  .jf.jf-wide{grid-column:1 / -1}
}
.jf label{display:block;font-family:'Montserrat',sans-serif;font-size:11px;color:var(--muted);margin-bottom:7px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.jf textarea{
  width:100%;border:none;background:var(--row);border-radius:10px;
  font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--ink);
  padding:10px 12px;resize:vertical;min-height:48px;line-height:1.5;
}
.jf textarea:focus{outline:none;background:var(--row-hi);box-shadow:0 0 0 2px var(--focus)}
.jf textarea::placeholder{color:var(--ph)}

/* ---------- статистика спринта ---------- */
.ovgrid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){
  .ovgrid{grid-template-columns:1fr 1fr}
}

/* ---------- итоги спринта ---------- */
.verdict-row{display:flex;gap:8px;padding:12px 14px 0;flex-wrap:wrap}
.vbtn{flex:1;min-width:130px;border:1.5px solid var(--line);background:var(--row);color:var(--muted);border-radius:11px;padding:10px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;transition:background .15s,color .15s,border-color .15s}
.vbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-finish{
  border:1px solid var(--accent);background:var(--accent);color:#fff;
  border-radius:9px;padding:9px 14px;font-size:11px;font-weight:500;letter-spacing:.08em;white-space:nowrap;
}
.btn-finish:active{transform:scale(.98)}


/* ---------- тост ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
  background:var(--ink);color:#fff;border-radius:999px;
  padding:11px 18px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;z-index:50;max-width:88vw;text-align:center;
  user-select:none;-webkit-user-select:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

</style>
</head>

<script>
'use strict';
/* ================= константы ================= */
var WEEKS = 8;
var SPRINT_LABEL = '8 недель';
var LS_KEY = 'focussimo_sprint_' + WEEKS + 'w';
var DOW_FULL = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
var DOW3     = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
var DOW2     = ['вс','пн','вт','ср','чт','пт','сб'];
var MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONTHS_GEN = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var DEF_HABITS = ['Без соцсетей утром','Стакан воды утром','Спорт каждый день','Обучение чему-либо','Съёмка и монтаж','Планирование','Записи в дневник'];
var MAX_TASKS = 30, MAX_HABITS = 15;

/* ================= иконки (SVG, line) ================= */
function ic(name, size){
  size = size || 15;
  var P = {
    progress:'<path d="M3 17l5.5-6 4 3.5L21 5"/><path d="M15.5 5H21v5.5"/>',
    bars:'<path d="M5 20v-8"/><path d="M10 20V4"/><path d="M15 20v-6"/><path d="M2 20h20"/>',
    tasks:'<rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M8.5 12.5l2.5 2.5 5-5.5"/>',
    star:'<path d="M12 3.5l2.6 5.3 5.9.86-4.25 4.14 1 5.8L12 16.9l-5.25 2.7 1-5.8L3.5 9.66l5.9-.86z"/>',
    repeat:'<path d="M17 2.5L21 6.5l-4 4"/><path d="M21 6.5H8a5 5 0 00-5 5v.5"/><path d="M7 21.5l-4-4 4-4"/><path d="M3 17.5h13a5 5 0 005-5V12"/>',
    moon:'<path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/>',
    book:'<path d="M4 5.5A2.5 2.5 0 016.5 3H20v16H6.5A2.5 2.5 0 004 21.5z"/><path d="M20 19H6.5A2.5 2.5 0 004 21.5"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2.1 2.1M16.9 16.9L19 19M19 5l-2.1 2.1M7.1 16.9L5 19"/>',
    download:'<path d="M12 3v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M4 18.5V20h16v-1.5"/>',
    bolt:'<path d="M13 2.5L4.5 13.5H11L10 21.5 19.5 10.5H13z"/>',
    smile:'<circle cx="12" cy="12" r="8.5"/><path d="M8.5 14.2a4.6 4.6 0 007 0"/><path d="M9.2 9.6h.01M14.8 9.6h.01"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    check:'<path d="M4 12.5l5 5L20 6.5"/>'
  };
  return '<svg viewBox="0 0 24 24" width="'+size+'" height="'+size+'" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(P[name]||'')+'</svg>';
}

/* ================= даты ================= */
function toISO(d){ return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
function parseISO(s){ var p=s.split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); }
function addDaysISO(s,n){ var d=parseISO(s); d.setUTCDate(d.getUTCDate()+n); return toISO(d); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function mondayOf(d){ var x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); var wd=(x.getUTCDay()+6)%7; x.setUTCDate(x.getUTCDate()-wd); return toISO(x); }
function absDayDateISO(a){ return addDaysISO(state.sprintStart, a); }
function dayDow(a){ return parseISO(absDayDateISO(a)).getUTCDay(); }
function dayFull(a){ return DOW_FULL[dayDow(a)]; }
function day3(a){ return DOW3[dayDow(a)]; }
function day2(a){ return DOW2[dayDow(a)]; }
function fmtDayYear(a){ var d=parseISO(absDayDateISO(a)); return d.getUTCDate()+' '+MONTHS[d.getUTCMonth()]+', '+d.getUTCFullYear(); }
function fmtShort(iso){ var d=parseISO(iso); return String(d.getUTCDate()).padStart(2,'0')+'.'+String(d.getUTCMonth()+1).padStart(2,'0'); }
function weekStartISO(w){ return addDaysISO(state.sprintStart, w*7); }
function weekRangeLabel(w){
  var a=weekStartISO(w), b=addDaysISO(a,6);
  return fmtShort(a)+' – '+fmtShort(b);
}
function sprintRangeLabel(){
  var a=state.sprintStart, b=addDaysISO(a, WEEKS*7-1);
  var da=parseISO(a), db=parseISO(b);
  return da.getUTCDate()+' '+MONTHS[da.getUTCMonth()]+' – '+db.getUTCDate()+' '+MONTHS[db.getUTCMonth()]+', '+db.getUTCFullYear();
}
function weekOfAbs(a){ return Math.floor(a/7); }
/* ================= состояние ================= */
function emptyTask(){ return {t:'',done:false}; }
function defDay(){
  var tasks=[]; for(var k=0;k<10;k++) tasks.push(emptyTask());
  return {tasks:tasks, sleep:'', energy:0, mood:0, wisdom:'', thanks:'', thoughts:''};
}
function defState(){
  var days=[];
  for(var a=0;a<WEEKS*7;a++) days.push(defDay());
  return {
    sprintStart: mondayOf(new Date()),
    activeWeek:0,
    maxUnlocked:0,
    goal:'',
    tools:'',
    finished:null,
    retro:{good:'',bad:'',next:''},
    trackNames:{energy:'Энергия',mood:'Настроение'},
    secNames:{goal:'Цель спринта',tools:'Инструменты',finish:'Итоги спринта',progress:'Прогресс спринта',taskWeeks:'Задачи по неделям',habWeeks:'Привычки по неделям',trackers:'Трекеры спринта',dayTasks:'Задачи дня',dayHabits:'Трекер привычек',dayMood:'Как прошёл день',journal:'Дневник'},
    days: days,
    habits: DEF_HABITS.map(function(n){
      var arr=[]; for(var a=0;a<WEEKS*7;a++) arr.push(false);
      return {name:n, days:arr};
    })
  };
}
function fixShape(s){
  var d = defState();
  if(!s || typeof s!=='object') return d;
  s.sprintStart = s.sprintStart || d.sprintStart;
  s.goal = String(s.goal||'');
  s.tools = Array.isArray(s.tools)? s.tools.map(String).join('\n') : String(s.tools||'');
  if(s.finished!=='done' && s.finished!=='not' && s.finished!=='pending') s.finished = null;
  if(!s.retro || typeof s.retro!=='object') s.retro = {good:'',bad:'',next:''};
  s.retro.good=String(s.retro.good||''); s.retro.bad=String(s.retro.bad||''); s.retro.next=String(s.retro.next||'');
  if(!s.trackNames || typeof s.trackNames!=='object') s.trackNames = {energy:'Энергия',mood:'Настроение'};
  s.trackNames.energy = String(s.trackNames.energy||'Энергия');
  s.trackNames.mood = String(s.trackNames.mood||'Настроение');
  if(!s.secNames || typeof s.secNames!=='object') s.secNames = {};
  var snD = d.secNames;
  for(var snk in snD){ if(typeof s.secNames[snk]!=='string') s.secNames[snk] = snD[snk]; }
  s.maxUnlocked = Math.min(WEEKS-1, Math.max(0, +s.maxUnlocked||0));
  var aw = +s.activeWeek;
  if(!(aw>=0 && aw<=s.maxUnlocked)) aw = s.maxUnlocked;
  s.activeWeek = aw;
  s.habits = Array.isArray(s.habits) && s.habits.length ? s.habits : d.habits;
  s.days = (Array.isArray(s.days) && s.days.length===WEEKS*7) ? s.days : d.days;
  for(var i=0;i<WEEKS*7;i++){
    var dd = s.days[i] || {};
    if(!Array.isArray(dd.tasks) || !dd.tasks.length) dd.tasks = d.days[i].tasks;
    if(typeof dd.sleep!=='string') dd.sleep='';

    dd.wisdom=dd.wisdom||''; dd.thanks=dd.thanks||''; dd.thoughts=dd.thoughts||'';

  }
  for(var h=0;h<s.habits.length;h++){
    if(!Array.isArray(s.habits[h].days) || s.habits[h].days.length!==WEEKS*7){
      var arr=[]; for(var z=0;z<WEEKS*7;z++) arr.push(false);
      s.habits[h].days=arr;
    }
  }
  return s;
}

/* ---------- Telegram CloudStorage: прогресс за аккаунтом пользователя ---------- */
var CS = (function(){
  try{
    var tg = window.Telegram && window.Telegram.WebApp;
    return (tg && tg.CloudStorage) ? tg.CloudStorage : null;
  }catch(e){ return null; }
})();
var CS_PREFIX = LS_KEY; /* допустимые символы: A-Z a-z 0-9 _ - */
function csReadState(cb){
  if(!CS){ cb(null); return; }
  CS.getItem(CS_PREFIX+'_n', function(err, nStr){
    if(err || !nStr){ cb(null); return; }
    var n = +nStr;
    if(!(n>=1 && n<=1024)){ cb(null); return; }
    var parts = new Array(n), got = 0, failed = false;
    for(var i=0;i<n;i++){
      (function(i){
        CS.getItem(CS_PREFIX+'_c'+i, function(e, v){
          if(e || v==null) failed = true;
          parts[i] = (v==null) ? '' : v;
          if(++got===n) cb(failed ? null : parts.join(''));
        });
      })(i);
    }
  });
}
function csWriteState(str, done){
  if(!CS){ if(done) done(); return; }
  var CH = 4000, n = Math.max(1, Math.ceil(str.length/CH));
  CS.getKeys(function(err, keys){
    var old = [];
    if(!err && keys){
      for(var i=0;i<keys.length;i++){
        var k = String(keys[i]);
        if(k.indexOf(CS_PREFIX+'_c')===0){
          var idx = parseInt(k.slice(CS_PREFIX.length+2), 10);
          if(!isNaN(idx) && idx>=n) old.push(k);
        }
      }
    }
    var pending = n + 1 + old.length, fin = false, hadErr = false;
    function tick(e){
      if(e) hadErr = true;
      if(--pending<=0 && !fin){ fin = true; if(done) done(hadErr ? 'cs' : null); }
    }
    for(var j=0;j<old.length;j++) CS.removeItem(old[j], tick);
    for(var c=0;c<n;c++){
      (function(c){ CS.setItem(CS_PREFIX+'_c'+c, str.substring(c*CH,(c+1)*CH), tick); })(c);
    }
    CS.setItem(CS_PREFIX+'_n', String(n), tick);
  });
}
var csTimer = null;
function save(){
  try{ state.__ts = Date.now(); localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  if(csTimer) clearTimeout(csTimer);
  csTimer = setTimeout(function(){
    csTimer = null;
    var s; try{ s = JSON.stringify(state); }catch(e){ return; }
    csWriteState(s, null);
  }, 800);
}
function csFlush(){
  if(!csTimer) return;
  clearTimeout(csTimer); csTimer = null;
  var s; try{ s = JSON.stringify(state); }catch(e){ return; }
  csWriteState(s, null);
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden') csFlush();
});
window.addEventListener('pagehide', csFlush);
function cloudSync(){
  if(!CS) return;
  csReadState(function(raw){
    if(!raw) return;
    var c;
    try{ c = fixShape(JSON.parse(raw)); }catch(e){ return; }
    if((+c.__ts||0) <= (+state.__ts||0)) return;
    state = c;
    document.getElementById('weekLabel').textContent = sprintRangeLabel();
    buildNav();
    buildWeekPills();
    setView('sp');
  });
}

/* ================= статистика ================= */
function dayTasksList(a){ return state.days[a].tasks.filter(function(t){return String(t.t).trim();}); }
function dayStats(a){
  var list = dayTasksList(a);
  var done = list.filter(function(t){return t.done;}).length;
  return {non:list.length, done:done, proc:list.length-done, pct: list.length? Math.round(done/list.length*100) : 0};
}
function updateFinishBtn(){
  var el = document.getElementById('btnFinish');
  if(!el) return;
  var last = WEEKS*7-1;
  el.hidden = !(curView==='d6' && state.activeWeek===WEEKS-1 && !state.finished && dayStats(last).done>0);
}
function weekStats(w){
  var non=0, done=0;
  for(var a=w*7;a<w*7+7;a++){ var s=dayStats(a); non+=s.non; done+=s.done; }
  return {non:non, done:done, proc:non-done, pct: non? Math.round(done/non*100):0};
}
function sprintStats(){
  var non=0, done=0;
  for(var a=0;a<WEEKS*7;a++){ var s=dayStats(a); non+=s.non; done+=s.done; }
  return {non:non, done:done, proc:non-done, pct: non? Math.round(done/non*100):0};
}
function sleepVal(a){
  var m = String(state.days[a].sleep).match(/(\d+[.,]?\d*)/);
  return m ? parseFloat(m[1].replace(',','.')) : 0;
}
function tnName(kind){
  var n = (state.trackNames && state.trackNames[kind]) || '';
  return n.trim() || (kind==='energy' ? 'Энергия' : 'Настроение');
}
function trackerWeekAvg(w, kind){
  var sum=0, cnt=0;
  for(var a=w*7;a<w*7+7;a++){
    var v = kind==='sleep'? sleepVal(a) : (+state.days[a][kind]||0);
    if(v>0){ sum+=v; cnt++; }
  }
  return cnt? {avg:sum/cnt, cnt:cnt} : null;
}

function ringHTML(pct, size, sw, fs){

    + '</svg><div class="val" style="font-size:'+fs+'px">'+pct+'%</div></div>';

    + '<div class="jf"><label>Благодарность</label><textarea data-loc="d'+a+'thk" rows="2" placeholder="За что благодарен(на)">'+esc(d.thanks)+'</textarea></div>'
    + '<div class="jf jf-wide"><label>Мысли и идеи на следующие дни</label><textarea data-loc="d'+a+'tho" rows="3" placeholder="Мысли, идеи, заметки">'+esc(d.thoughts)+'</textarea></div>'
    + '</div></div>';

  document.getElementById('v-day').innerHTML = h;
  updateFinishBtn();
  if(window._flashKi != null){
    var row = document.querySelector('.tasks-list .task[data-ki="'+window._flashKi+'"]');
    if(row) row.classList.add('flash');
    window._flashKi = null;
  }
}
function updateDayDerived(a){
  var s = dayStats(a);
  function set(id, v){ var el=document.getElementById(id); if(el) el.textContent=v; }
  set('taskBadge', s.done+'/'+s.non);
  set('habBadge', state.habits.filter(function(x){return x.days[a];}).length+'/'+state.habits.length);
  var head=document.querySelector('#v-day .dayhead .ring-dh');
  if(head) head.innerHTML = ringHTML(s.pct,52,5,11);
  document.querySelectorAll('#v-day .task').forEach(function(row){
    var ki = +row.getAttribute('data-ki');
    var tk = state.days[a].tasks[ki];
    if(tk) row.classList.toggle('done', !!tk.done);
  });
}

/* ================= действия ================= */
function doAdd(kind){
  var parts = kind.split(':');
  var type = parts[0], a = +parts[1];
  if(type==='task'){
    if(state.days[a].tasks.length>=MAX_TASKS){ toast('Максимум '+MAX_TASKS+' задач на день'); return; }
    state.days[a].tasks.push(emptyTask());
    window._flashKi = state.days[a].tasks.length-1;
    save(); renderDay(a);
    var last = document.querySelectorAll('#v-day .task-in');
    if(last.length) last[last.length-1].focus();
    return;
  }
  if(type==='habit'){
    if(state.habits.length>=MAX_HABITS){ toast('Максимум '+MAX_HABITS+' привычек'); return; }
    var arr=[]; for(var z=0;z<WEEKS*7;z++) arr.push(false);
    state.habits.push({name:'', days:arr});
    save();
    if(curView==='sp') renderSprint(); else renderDay(state.activeWeek*7 + +curView.charAt(1));
    var all = document.querySelectorAll('#v-day .hab-name');
    if(all.length) all[all.length-1].focus();
    return;
  }
}
function doRemove(loc){
  var m;
  if((m=loc.match(/^d(\d+)t(\d+)x$/))){
    var i=+m[1], k=+m[2], t=state.days[i].tasks[k];
    if(String(t.t).trim() && !confirm('Удалить задачу?')) return;
    state.days[i].tasks.splice(k,1);
    save(); renderDay(i); buildNav(); return;
  }
  if((m=loc.match(/^h(\d+)x$/))){
    var hk=+m[1], hb=state.habits[hk];
    var used=hb.days.some(Boolean);
    if((String(hb.name).trim()||used) && !confirm('Удалить привычку?')) return;
    state.habits.splice(hk,1);
    if(!state.habits.length){
      var arr=[]; for(var z=0;z<WEEKS*7;z++) arr.push(false);
      state.habits.push({name:'',days:arr});
    }
    save(); buildNav(); if(curView==='sp') renderSprint(); else renderDay(state.activeWeek*7 + +curView.charAt(1));
    return;
  }

}

/* ================= события ================= */
document.addEventListener('input', function(e){
  var el = e.target;
  if(!el || !el.dataset || !el.dataset.loc) return;
  var loc = el.dataset.loc, v = el.value;
  var m;
  if(loc==='goal'){ state.goal = v; }
  else if(loc==='tools'){ state.tools = v; }
  else if(loc==='rt_good'){ state.retro.good = v; }
  else if(loc==='rt_bad'){ state.retro.bad = v; }
  else if(loc==='rt_next'){ state.retro.next = v; }
  else if((m=loc.match(/^d(\d+)t(\d+)$/))){ state.days[+m[1]].tasks[+m[2]].t = v; }
  else if((m=loc.match(/^d(\d+)sl$/))){ state.days[+m[1]].sleep = v; }
  else if((m=loc.match(/^d(\d+)(wi|thk|tho)$/))){
    var f={'wi':'wisdom','thk':'thanks','tho':'thoughts'};
    state.days[+m[1]][f[m[2]]] = v;
  }
  else if((m=loc.match(/^h(\d+)n$/))){ state.habits[+m[1]].name = v; }
  else if(loc==='tn_energy'){ state.trackNames.energy = v; }
  else if(loc==='tn_mood'){ state.trackNames.mood = v; }
  else if((m=loc.match(/^sn_(goal|tools|finish|progress|taskWeeks|habWeeks|trackers|dayTasks|dayHabits|dayMood|journal)$/))){ state.secNames[m[1]] = v; }
  else return;
  save();
  if(curView!=='sp') updateDayDerived(state.activeWeek*7 + +curView.charAt(1));
});

function haptic(kind){
  try{
    var tg = window.Telegram && window.Telegram.WebApp;
    if(tg && tg.HapticFeedback){
      if(kind==='success') tg.HapticFeedback.notificationOccurred('success');
      else tg.HapticFeedback.impactOccurred(kind||'light');
    }
  }catch(e){}
}

document.addEventListener('click', function(e){
  var t = e.target;
  if(!t || !t.closest) return;

  var tab = t.closest('.nav .tab');
  if(tab){ setView(tab.getAttribute('data-view')); return; }

  var wk = t.closest('.wk');
  if(wk){ setActiveWeek(+wk.getAttribute('data-w')); return; }

  var add = t.closest('[data-add]');
  if(add){ doAdd(add.getAttribute('data-add')); return; }

  var act = t.closest('[data-act]');
  if(act){
    var av = act.getAttribute('data-act');
    if(av==='finish'){
      if(confirm('Завершить спринт?\n\nНа вкладке «Главная» появится блок «Итоги спринта».')){
        state.finished = 'pending';
        save();
        setView('sp');
        toast('Спринт завершён — подведите итоги');
        var fEl = document.querySelector('.fin-card');
        if(fEl && fEl.scrollIntoView) fEl.scrollIntoView({behavior:'smooth', block:'start'});
      }
      return;
    }
    if(av==='vd-done'){ state.finished = 'done'; save(); renderSprint(); return; }
    if(av==='vd-not'){ state.finished = 'not'; save(); renderSprint(); return; }
    return;
  }

  var rm = t.closest('.rmbtn');
  if(rm){ doRemove(rm.dataset.loc); return; }

  var chk = t.closest('.chk, .hchk');
  if(chk){
    var loc = chk.dataset.loc;
    var on = !chk.classList.contains('on');
    chk.classList.toggle('on', on);
    haptic('light');
    var m;
    if((m=loc.match(/^d(\d+)t(\d+)c$/))){
      state.days[+m[1]].tasks[+m[2]].done = on;
      document.querySelectorAll('#v-day .task[data-ki="'+m[2]+'"]').forEach(function(r){ r.classList.toggle('done', on); });
      save(); updateDayDerived(state.activeWeek*7 + +curView.charAt(1));
      buildNav();
      updateFinishBtn();
      if(on && (+m[1])%7===6){
        var wu = weekOfAbs(+m[1]);
        if(wu+1 <= WEEKS-1 && wu+1 > state.maxUnlocked){
          state.maxUnlocked = wu+1;
          save();
          buildWeekPills();
          if(curView==='sp') renderSprint();
          toast('Неделя '+(wu+2)+' открыта — так держать!');
        }
      }
    } else if((m=loc.match(/^h(\d+)d(\d+)$/))){
      state.habits[+m[1]].days[+m[2]] = on;
      var a=+m[2];
      document.querySelectorAll('.hchk[data-loc="'+loc+'"]').forEach(function(n){ n.classList.toggle('on', on); });
      save(); buildNav(); if(curView==='sp') renderSprint(); else updateDayDerived(a);
    }
    return;
  }

  var star = t.closest('.stars button');
  if(star){
    var sloc = star.dataset.loc;
    var sm = sloc.match(/^d(\d+)([em])(\d)$/);
    if(sm){
      var di=+sm[1], key = sm[2]==='e'?'energy':'mood', k=+sm[3];
      var nv = state.days[di][key]===k ? 0 : k;
      state.days[di][key] = nv;
      haptic('light');
      save();
      var cont = star.parentElement;
      if(cont && cont.querySelectorAll){
        cont.querySelectorAll('button').forEach(function(b, bi){
          b.classList.toggle('on', bi < nv);
        });
        cont.setAttribute('aria-valuenow', String(nv));
      }
      if(curView==='d'+(di%7)) updateDayDerived(di);
    }
    return;
  }
});

/* ---------- свайп между днями (в пределах недели) ---------- */
(function(){
  var panel = document.getElementById('v-day');
  var sx=0, sy=0, tracking=false;
  panel.addEventListener('pointerdown', function(e){
    if(e.target.closest('input,textarea,button')) return;
    if(curView==='sp') return;
    tracking=true; sx=e.clientX; sy=e.clientY;
  });
  panel.addEventListener('pointerup', function(e){
    if(!tracking) return; tracking=false;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy)*1.3) return;
    var i = +curView.charAt(1);
    var n = dx < 0 ? Math.min(6, i+1) : Math.max(0, i-1);
    setView('d'+n);
  });
  panel.addEventListener('pointercancel', function(){ tracking=false; });
})();

/* ---------- новый спринт: календарь по кнопке ---------- */
var datePicker = document.getElementById('datePicker');
function openDatePicker(){
  try{
    datePicker.value = todayISO();
    if(typeof datePicker.showPicker === 'function'){ datePicker.showPicker(); return; }
    datePicker.focus();
    datePicker.click();
  }catch(e){ try{ datePicker.click(); }catch(e2){} }
}
function startSprintOn(date){
  state.sprintStart = date;
  state.goal = '';
  state.tools = '';
  state.finished = null;
  state.retro = {good:'',bad:'',next:''};
  var days=[];
  for(var a=0;a<WEEKS*7;a++) days.push(defDay());
  state.days = days;
  state.habits = state.habits.map(function(hb){
    var arr=[]; for(var z=0;z<WEEKS*7;z++) arr.push(false);
    return {name:hb.name, days:arr};
  });
  state.maxUnlocked = 0;
  state.activeWeek = 0;
  save();
  document.getElementById('weekLabel').textContent = sprintRangeLabel();
  buildNav();
  buildWeekPills();
  setView('sp');
  haptic('success');
  toast('Новый спринт начат: ' + fmtShort(date));
}
document.getElementById('btnNew').addEventListener('click', openDatePicker);
datePicker.addEventListener('change', function(e){
  var d = e.target.value;
  if(!d || d === state.sprintStart) return;
  if(confirm('Начать новый спринт с ' + fmtShort(d) + '?\n\nДанные текущего спринта (цель, инструменты, задачи, дневник, итоги) будут очищены. Имена привычек и названия блоков сохранятся.')) startSprintOn(d);
});

/* ---------- тост ---------- */
var toastEl = document.getElementById('toast');
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 2400);
}

/* ---------- Telegram Mini App ---------- */
try{
  if(window.Telegram && window.Telegram.WebApp){
    var tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();
    try{ tg.setHeaderColor('#F7F7F7'); }catch(e2){}
  }
}catch(e){}

/* ---------- старт ---------- */
buildNav();
buildWeekPills();
document.getElementById('weekLabel').textContent = sprintRangeLabel();
setView('sp');
cloudSync();
</script>
